[build]
  command = "bun install --frozen-lockfile && cd apps/frontend && bun run build"
  publish = "apps/frontend/dist"

[build.environment]
  BUN_VERSION = "1.3.11"
  BUN_PUBLIC_API_URL = "https://worknest-backend-7ep8.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
